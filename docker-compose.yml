# LinkSwift-sync one-click deployment (amd64 / arm64)
# Usage:
#   1) Edit ./config/jobs.json and ./config/rclone.conf
#   2) docker compose up -d
#
# Multi-arch image: specify --platform linux/amd64,linux/arm64 at build time to
# produce both architectures.

services:
  linkswift-sync:
    image: linkswift-sync:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # To build multi-arch in one shot, use buildx:
      # docker buildx build --platform linux/amd64,linux/arm64 -t linkswift-sync:latest --push .
    container_name: linkswift-sync
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"        # Web console
    environment:
      - TZ=Asia/Shanghai
      - CACHE_DIR=/data/cache
      - CONFIG_DIR=/data/config
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}   # periodic sync interval (seconds)
      - RCLONE_TRANSFERS=${RCLONE_TRANSFERS:-16}
      - RCLONE_CHECKERS=${RCLONE_CHECKERS:-16}
    volumes:
      # Config (your remote definitions + jobs)
      - ./config:/data/config
      # Cache: must be persistent, resume depends on it
      - ./cache:/data/cache
    command: ["web"]   # start Web console (resident); or ["once"] to run once then exit
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkSwift-sync 控制台</title>
<style>
  /* ---- 亮色主题 ---- */
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#64748b;
    --accent:#2563eb; --accent-2:#1d4ed8; --ok:#16a34a; --err:#dc2626; --warn:#d97706;
    --radius:8px; --input-bg:#fff; --log-bg:#0f172a; --log-text:#e2e8f0;
    --modal-mask:rgba(15,23,42,.45); --hover-bg:#e2e8f0; --badge-idle-bg:#f1f5f9; --badge-idle-text:#475569;
  }
  /* ---- 暗色主题 ---- */
  [data-theme="dark"]{
    --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#3b82f6; --accent-2:#60a5fa; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b;
    --input-bg:#1e293b; --log-bg:#020617; --log-text:#cbd5e1;
    --modal-mask:rgba(0,0,0,.65); --hover-bg:#334155; --badge-idle-bg:#1e293b; --badge-idle-text:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;color:var(--accent-2)}
  header .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:8px;margin-left:auto;align-items:center}
  nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:14px}
  nav button.active{background:var(--accent);color:#fff}
  nav button:hover:not(.active){background:var(--hover-bg)}
  main{max-width:1100px;margin:24px auto;padding:0 20px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
  .panel h2{margin:0 0 14px;font-size:16px;color:var(--text)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  label{font-size:13px;color:var(--muted)}
  input[type=text],input[type=password],textarea,select{font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text)}
  input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button.primary{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:14px}
  button.primary:hover{background:var(--accent-2)}
  button.ghost{background:var(--panel);color:var(--accent);border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px}
  button.ghost:hover{border-color:var(--accent);background:var(--hover-bg)}
  button.danger{background:var(--panel);color:var(--err);border:1px solid var(--border);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .badge.ok{background:#dcfce7;color:#166534}
  .badge.err{background:#fee2e2;color:#991b1b}
  .badge.run{background:#dbeafe;color:#1e40af}
  .badge.idle{background:var(--badge-idle-bg);color:var(--badge-idle-text)}
  pre.logs{background:var(--log-bg);color:var(--log-text);padding:14px;border-radius:var(--radius);font-size:12px;max-height:420px;overflow:auto;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  form .field{margin-bottom:12px}
  form .field label{display:block;margin-bottom:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .bread{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
  .bread a{color:var(--accent);cursor:pointer}
  .hidden{display:none}
  .dir-item{padding:6px 8px;border-radius:4px;cursor:pointer}
  .dir-item:hover{background:var(--hover-bg)}
  .dir-item.file{padding-left:22px;color:var(--muted)}
  .dir-item.folder{font-weight:600}
  .modal-mask{position:fixed;inset:0;background:var(--modal-mask);display:none;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border-radius:var(--radius);padding:24px;width:560px;max-width:94vw;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 16px;color:var(--text)}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:18px}
  .inline{display:inline-flex;align-items:center;gap:6px}
  code{background:var(--hover-bg);padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:360px;max-width:94vw">
    <h2 style="margin:0 0 6px;text-align:center;color:var(--accent-2)">LinkSwift-sync</h2>
    <p id="login-subtitle" style="text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px"></p>
    <form id="login-form" autocomplete="off">
      <div class="field"><label id="lbl-username"></label><input type="text" id="login-user" name="login-user" autocomplete="off" required style="width:100%"></div>
      <div class="field"><label id="lbl-password"></label><input type="password" id="login-pass" name="login-pass" autocomplete="off" required style="width:100%"></div>
      <button type="submit" class="primary" style="width:100%;padding:10px" id="btn-login"></button>
      <p id="login-err" style="color:var(--err);font-size:13px;margin:10px 0 0;text-align:center"></p>
    </form>
    <p class="hint" id="login-hint" style="text-align:center;margin-top:16px"></p>
  </div>
</div>

<!-- 强制改密模态 -->
<div class="modal-mask" id="pw-modal" style="display:none">
  <div class="modal" style="width:420px">
    <h3 id="pw-modal-title" style="margin:0 0 6px"></h3>
    <p class="hint" id="pw-modal-desc" style="margin:0 0 16px"></p>
    <form id="pw-form" autocomplete="off">
      <div class="field"><label id="lbl-oldpass"></label><input type="password" id="pw-old" autocomplete="off" required style="width:100%"></div>
      <div class="field"><label id="lbl-newuser"></label><input type="text" id="pw-user" autocomplete="off" style="width:100%"></div>
      <div class="field"><label id="lbl-newpass"></label><input type="password" id="pw-new" autocomplete="off" required style="width:100%"></div>
      <div class="field"><label id="lbl-confirmpass"></label><input type="password" id="pw-confirm" autocomplete="off" required style="width:100%"></div>
      <p id="pw-err" style="color:var(--err);font-size:13px;margin:6px 0"></p>
      <div class="row"><button type="submit" class="primary" id="btn-pw-submit"></button></div>
    </form>
  </div>
</div>

<!-- 设置模态 -->
<div class="modal-mask" id="settings-modal" style="display:none">
  <div class="modal" style="width:460px">
    <span class="close" onclick="closeSettings()">&times;</span>
    <h3 id="settings-title" style="margin:0 0 16px"></h3>
    <div class="field">
      <label id="lbl-language"></label>
      <select id="set-lang" style="width:100%">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="field">
      <label id="lbl-theme"></label>
      <select id="set-theme" style="width:100%">
        <option value="light" id="opt-theme-light"></option>
        <option value="dark" id="opt-theme-dark"></option>
      </select>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
    <h3 style="margin:0 0 10px" id="settings-change-pw-title"></h3>
    <form id="settings-pw-form" autocomplete="off">
      <div class="field"><label id="lbl-pw-old"></label><input type="password" id="spw-old" autocomplete="off" required style="width:100%"></div>
      <div class="field"><label id="lbl-pw-new-user"></label><input type="text" id="spw-new-user" autocomplete="off" style="width:100%"></div>
      <div class="field"><label id="lbl-pw-new"></label><input type="password" id="spw-new" autocomplete="off" required style="width:100%"></div>
      <div class="field"><label id="lbl-pw-confirm"></label><input type="password" id="spw-confirm" autocomplete="off" required style="width:100%"></div>
      <p id="spw-err" style="color:var(--err);font-size:13px;margin:6px 0"></p>
      <button type="submit" class="danger" id="btn-spw-submit" style="padding:8px 16px"></button>
    </form>
  </div>
</div>

<header>
  <h1>LinkSwift-sync</h1>
  <span class="sub" id="header-sub"></span>
  <nav>
    <button data-tab="jobs" class="active" id="nav-jobs"></button>
    <button data-tab="remotes" id="nav-remotes"></button>
    <button data-tab="logs" id="nav-logs"></button>
    <button onclick="openSettings()" id="nav-settings">⚙️</button>
    <button onclick="doLogout()" style="color:var(--err)" id="nav-logout"></button>
  </nav>
</header>
<main>
  <!-- TASKS TAB -->
  <section id="tab-jobs">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0" id="jobs-title"></h2>
        <div style="margin-left:auto" class="row">
          <button class="primary" onclick="openJobModal()" id="btn-new-job"></button>
          <button class="ghost" onclick="refreshAll()" id="btn-refresh"></button>
        </div>
      </div>
      <table>
        <thead><tr><th id="th-name"></th><th id="th-source"></th><th id="th-target"></th><th id="th-mode"></th><th id="th-bidir"></th><th id="th-schedule"></th><th id="th-status"></th><th></th></tr></thead>
        <tbody id="job-rows"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2 id="jobs-help-title"></h2>
      <ul class="hint" style="font-size:13px;line-height:1.8" id="jobs-help-list">
      </ul>
    </div>
  </section>

  <!-- REMOTES TAB -->
  <section id="tab-remotes" class="hidden">
    <div class="panel">
      <h2 id="remotes-openlist-title"></h2>
      <p class="hint" id="remotes-openlist-desc"></p>
      <div class="grid">
        <div class="field"><label id="lbl-ol-name"></label><input type="text" id="ol-name" value="openlist" style="width:100%"></div>
        <div class="field"><label id="lbl-ol-url"></label><input type="text" id="ol-url" placeholder="http://openlist:5244/dav" style="width:100%"></div>
        <div class="field"><label id="lbl-ol-user"></label><input type="text" id="ol-user" style="width:100%"></div>
        <div class="field"><label id="lbl-ol-pass"></label><input type="password" id="ol-pass" style="width:100%"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" onclick="addOpenList()" id="btn-connect-openlist"></button>
        <span id="ol-result" class="hint"></span>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
      <h2 id="remotes-raw-title"></h2>
      <p class="hint" id="remotes-raw-desc"></p>
      <div class="row" style="margin-bottom:12px">
        <label id="lbl-remotes-known"></label><span id="remote-names" class="hint">-</span>
        <button class="ghost" type="button" onclick="loadRemoteRaw()" id="btn-reload-remotes"></button>
      </div>
      <textarea id="remote-conf" rows="16" style="width:100%;font-family:ui-monospace,Consolas,monospace"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="saveRemoteRaw()" id="btn-save-remotes"></button>
        <span id="remote-save-result" class="hint"></span>
      </div>
      <p class="hint" id="remotes-after-save"></p>
    </div>
  </section>

  <!-- LOGS TAB -->
  <section id="tab-logs" class="hidden">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0" id="logs-title"></h2>
        <button class="ghost" style="margin-left:auto" onclick="loadLogs()" id="btn-refresh-logs"></button>
      </div>
      <pre class="logs" id="log-box"></pre>
    </div>
  </section>
</main>

<!-- JOB MODAL -->
<div class="modal-mask" id="job-modal">
  <div class="modal">
    <span class="close" onclick="closeJobModal()">&times;</span>
    <h3 id="job-modal-title"></h3>
    <form id="job-form">
      <div class="field"><label id="lbl-job-name"></label>
        <input type="text" id="f-name" required style="width:100%"></div>

      <div class="grid">
        <div class="field"><label id="lbl-job-dl-remote"></label>
          <select id="f-dl-remote" style="width:100%"></select>
          <button type="button" class="ghost" style="margin-top:6px" onclick="openBrowser('dl')" id="btn-browse-dl"></button>
          <div id="dl-browser"></div>
        </div>
        <div class="field"><label id="lbl-job-dl-path"></label>
          <input type="text" id="f-dl-path" style="width:100%">
        </div>
      </div>
      <div class="field"><label id="lbl-job-url"></label>
        <input type="text" id="f-dl-url" style="width:100%">
      </div>

      <div class="field"><label id="lbl-job-ups"></label>
        <textarea id="f-ups" rows="3" style="width:100%"></textarea>
        <span class="hint" id="hint-ups"></span>
      </div>

      <div class="grid">
        <div class="field"><label id="lbl-job-mode"></label>
          <select id="f-mode">
            <option value="full" id="opt-mode-full"></option>
            <option value="incremental" id="opt-mode-incremental"></option>
            <option value="add_only" id="opt-mode-addonly"></option>
          </select>
        </div>
        <div class="field"><label id="lbl-job-schedule"></label>
          <select id="f-schedule">
            <option value="manual" id="opt-sched-manual"></option>
            <option value="interval" id="opt-sched-interval"></option>
            <option value="cron" id="opt-sched-cron"></option>
          </select>
        </div>
      </div>
      <div class="grid">
        <div class="field hidden" id="f-interval-wrap"><label id="lbl-interval"></label>
          <input type="text" id="f-interval" value="300"></div>
        <div class="field hidden" id="f-cron-wrap"><label id="lbl-cron"></label>
          <input type="text" id="f-cron" placeholder="*/30 * * * *"><span class="hint" id="hint-cron"></span></div>
      </div>

      <div class="grid">
        <div class="field"><label id="lbl-bidir"></label>
          <select id="f-bidir"><option value="0" id="opt-bidir-off"></option><option value="1" id="opt-bidir-on"></option></select>
        </div>
        <div class="field"><label id="lbl-maxsize"></label>
          <input type="text" id="f-maxsize">
        </div>
      </div>
      <div class="field"><label id="lbl-excludes"></label>
        <textarea id="f-excludes" rows="2" style="width:100%"></textarea>
      </div>
      <div class="row">
        <button type="submit" class="primary" id="btn-save-job"></button>
        <button type="button" class="ghost" onclick="closeJobModal()" id="btn-cancel-job"></button>
      </div>
    </form>
  </div>
</div>

let currentTab="jobs";
let jobBeingEdited=null;
let dlRemoteSel='';

// ==================== API helpers ====================
let SESSION_TOKEN = null;

async function api(path, opts){
  const headers = opts?.headers ? {...opts.headers} : {};
  if(SESSION_TOKEN) headers['Authorization'] = 'Bearer '+SESSION_TOKEN;
  if(opts?.body) headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  const r = await fetch(path, {...(opts||{}), headers});
  const j = await r.json().catch(()=>({}));
  if(r.status===401){ showLogin(); throw new Error(t("login_err")); }
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  if(j.token) SESSION_TOKEN = j.token;
  return j;
}
const get=(p)=>api(p);
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const put=(p,b)=>api(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const del=(p)=>api(p,{method:'DELETE'});

// ==================== tabs ====================
document.querySelectorAll('nav button[data-tab]').forEach(b=>{

    document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.toggle('active',x===b));

    if(currentTab==='remotes') loadRemoteRaw();
    if(currentTab==='logs') loadLogs();
    if(currentTab==='jobs') loadJobs();
  };
});
const sel=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ==================== jobs ====================
async function loadJobs(){
  try{
    const d=await get('/api/jobs');
    const rows=d.jobs||[];
    sel('job-rows').innerHTML = rows.length? rows.map(j=>{
      const st=(d.states&&d.states[j.name])||{status:'idle'};
      const stc={running:'run',success:'ok',error:'err',idle:'idle'}[st.status]||'idle';
      const stl={running:t("badge_running"),success:t("badge_success"),error:t("badge_error"),idle:t("badge_idle")}[st.status]||t("badge_idle");
      const dlU=(j.dl&&j.dl.url)?'直链':'';
      const srcLabel=(j.dl.remote||'')+(j.dl.path||'')+(dlU);
      const ups=(j.ups||[]).map(u=>(u.remote||'')+(u.path||'')).join('<br>');
      const mode={'full':'全量','incremental':'增量','add_only':'仅新增'}[j.mode]||j.mode;
      const sch=(j.dl&&j.dl.schedule)||'manual';
      const schLbl={'manual':t("opt_sched_manual"),'interval':'每'+(j.dl.interval_seconds||300)+'s','cron':(j.dl.cron||'cron')}[sch]||t("opt_sched_manual");
      return `<tr>
        <td>${esc(j.name)}</td>
        <td>${esc(srcLabel)}</td>
        <td>${ups}</td>
        <td>${esc(mode)}</td>
        <td>${j.bidirectional?'✅':'—'}</td>
        <td>${esc(schLbl)}</td>
        <td><span class="badge ${stc}">${stl}</span></td>
        <td>
          <button class="ghost" onclick="runJob('${esc(j.name)}')">${t("btn_run")}</button>
          <button class="ghost" onclick="editJob('${esc(j.name)}')">${t("btn_edit")}</button>
          <button class="danger" onclick="delJob('${esc(j.name)}')">${t("btn_del")}</button>
        </td></tr>`;
    }).join('') : `<tr><td colspan="8" class="hint">${t("no_jobs")}</td></tr>`;
  }catch(e){ sel('job-rows').innerHTML=`<tr><td colspan="8" class="hint">${t("loading")}: ${esc(e.message)}</td></tr>`; }
}
async function runJob(name){ try{ await post(`/api/jobs/${encodeURIComponent(name)}/run`); alert(t("run_triggered")+name); }catch(e){ alert(e.message);} }
async function delJob(name){ if(!confirm(t("confirm_del")+name+' ?'))return; try{ await del(`/api/jobs/${encodeURIComponent(name)}`); loadJobs(); }catch(e){ alert(e.message);} }
function refreshAll(){ loadJobs(); }

// ==================== job modal ====================
async function fillRemoteSelect(){
  try{ const d=await get('/api/remotes'); if(d.remotes) sel('f-dl-remote').innerHTML=d.remotes.map(r=>`<option>${esc(r.replace(':',''))}</option>`).join('')||'<option value="">(无远程)</option>';
  }catch(e){ sel('f-dl-remote').innerHTML=`<option value="">(${t("loading")})</option>`; }
}
function resetJobModal(){
  sel('f-name').value=''; sel('f-dl-path').value=''; sel('f-dl-url').value='';
  sel('f-ups').value='';
  sel('f-mode').value='full'; sel('f-schedule').value='manual'; sel('f-bidir').value='0';
  sel('f-maxsize').value=''; sel('f-excludes').value='';
  sel('f-interval').value='300'; sel('f-cron').value='*/30 * * * *';
  sel('job-modal-title').textContent=t("job_modal_title_new"); jobBeingEdited=null;
  showScheduleFields(); fillRemoteSelect().then(()=>{ if(dlRemoteSel) sel('f-dl-remote').value=dlRemoteSel; });
}
function openJobModal(){ resetJobModal(); sel('job-modal').style.display='flex'; }
function closeJobModal(){ sel('job-modal').style.display='none'; }
function showScheduleFields(){
  const s=sel('f-schedule').value;
  sel('f-interval-wrap').classList.toggle('hidden', s!=='interval');
  sel('f-cron-wrap').classList.toggle('hidden', s!=='cron');
}
sel('f-schedule').onchange=showScheduleFields;
sel('f-dl-remote').onchange=()=>{ dlRemoteSel=sel('f-dl-remote').value; };

sel('job-form').onsubmit=async(e)=>{
  e.preventDefault();
  const name=sel('f-name').value.trim();
  const dlRemote=sel('f-dl-remote').value.match(/:$/) ? sel('f-dl-remote').value : sel('f-dl-remote').value+':';
  const upsRaw=sel('f-ups').value.trim();
  let ups=[];
  if(upsRaw){ try{ ups=JSON.parse(upsRaw); }catch(err){ alert('JSON: '+err.message); return; } }
  else{ ups=[{remote:dlRemote.match(/^[^:]+:/)[0]? dlRemote:'', path:sel('f-dl-path').value||''}]; if(!ups[0].remote){ alert(t("err_no_remote")); return;} }

  const dl={
    remote:dlRemote,
    path:sel('f-dl-path').value.trim(),
    url:sel('f-dl-url').value.trim()||undefined,
    schedule:sel('f-schedule').value,
    interval_seconds: sel('f-schedule').value==='interval'?parseInt(sel('f-interval').value||'300'):undefined,
    cron: sel('f-schedule').value==='cron'?sel('f-cron').value.trim():undefined,
  };
  ups=ups.map(u=>{ if(!u.path){ u.path='/'; } return u; });

  const body={
    name, dl, ups,
    mode:sel('f-mode').value,
    bidirectional: sel('f-bidir').value==='1',
    max_size: sel('f-maxsize').value?parseInt(sel('f-maxsize').value):undefined,
    excludes: sel('f-excludes').value.split('\n').map(x=>x.trim()).filter(Boolean),
  };
  try{
    if(jobBeingEdited){ await put('/api/jobs/'+encodeURIComponent(name), body); }
    else { await post('/api/jobs', body); }
    closeJobModal(); loadJobs();
  }catch(err){ alert(err.message); }
};

async function editJob(name){
  try{
    const j=await get('/api/jobs/'+encodeURIComponent(name));
    resetJobModal();
    jobBeingEdited=name; sel('job-modal-title').textContent=t("job_modal_title_edit")+name;
    sel('f-name').value=j.name;
    sel('f-dl-path').value=j.dl.path||''; sel('f-dl-url').value=j.dl.url||'';
    sel('f-ups').value=JSON.stringify(j.ups||[],null,2);
    sel('f-mode').value=j.mode||'full';
    sel('f-schedule').value=(j.dl&&j.dl.schedule)||'manual';
    sel('f-interval').value=(j.dl&&j.dl.interval_seconds)||'300';
    sel('f-cron').value=(j.dl&&j.dl.cron)||'*/30 * * * *';
    sel('f-bidir').value=j.bidirectional?'1':'0';
    sel('f-maxsize').value=j.max_size||'';
    sel('f-excludes').value=(j.excludes||[]).join('\n');
    showScheduleFields();
    dlRemoteSel=(j.dl.remote||'').replace(/:$/,'');
    fillRemoteSelect().then(()=>{ sel('f-dl-remote').value=dlRemoteSel; });
    sel('job-modal').style.display='flex';
  }catch(e){ alert(e.message); }
}

let browseCtx=null;
async function browseRemote(which, remote, path, open){
  const target=document.getElementById(which==='dl'?'dl-browser':'up-browser');
  try{
    if(browseCtx!==target) browseCtx=target;
    const d=await get('/api/list?remote='+encodeURIComponent(remote)+'&path='+encodeURIComponent(path));
    const crumbs=(d.path||'/').split('/').filter(Boolean);
    let acc='';
    let html=`<div class="bread"><span>${t("browse_root")}</span>`;
    crumbs.forEach((c,i)=>{ acc+='/'+c; html+=`<span>/</span><a onclick="browseRemote('${which}','${remote}','${acc}')">${esc(c)}</a>`; });
    html+=`</div><div style="margin-top:8px">`;
    if(path) html+=`<div class="dir-item folder" onclick="browseRemote('${which}','${remote}','${path.split('/').slice(0,-1).join('/')}')">${t("browse_up")}</div>`;
    (d.dirs||[]).forEach(dd=>{ html+=`<div class="dir-item folder" onclick="browseRemote('${which}','${remote}','${(path?path+('/') : '')+dd}')">📁 ${esc(dd)}</div>`; });
    (d.files||[]).slice(0,50).forEach(f=>{ html+=`<div class="dir-item file">📄 ${esc(f.name)} (${fmt(f.size)})</div>`; });
    html+=`<div class="row" style="margin-top:10px">
        <button class="primary" type="button" onclick="usePath('${which}','${remote}','${esc(path)}')">${t("btn_use_dir")}</button>
        <button class="ghost" type="button" onclick="closeBrowse('${which}')">${t("btn_collapse")}</button></div></div>`;
    target.innerHTML=html;
  }catch(e){ target.innerHTML=`<div class="hint">${t("browsing")}${esc(e.message)}</div>`; }
}
function usePath(which, remote, path){
  if(which==='dl'){ sel('f-dl-remote').value=remote; dlRemoteSel=remote.replace(/:$/,''); sel('f-dl-path').value=path; }
}
function closeBrowse(which){
  document.getElementById(which==='dl'?'dl-browser':'up-browser').innerHTML='';
}
function fmt(n){ if(n==null) return ''; if(n<1024) return n+'B'; if(n<1048576) return (n/1024).toFixed(1)+'KB'; if(n<1073741824) return (n/1048576).toFixed(1)+'MB'; return (n/1073741824).toFixed(2)+'GB'; }

// ==================== remotes ====================
async function addOpenList(){
  const body={name:sel('ol-name').value||'openlist', url:sel('ol-url').value, user:sel('ol-user').value, pass:sel('ol-pass').value};
  sel('ol-result').textContent=t("openlist_connecting");
  try{
    const d=await post('/api/openlist',body);
    sel('ol-result').textContent=t("openlist_ok")+(d.remotes||[]).join(', ');
    refreshRemoteNames(); loadRemoteRaw();
  }catch(e){ sel('ol-result').textContent='失败: '+e.message; }
}
async function loadRemoteRaw(){
  try{ const d=await get('/api/remotes/raw'); sel('remote-conf').value=d.content||''; }
  catch(e){ sel('remote-conf').value='# '+t("browsing")+e.message; }
  refreshRemoteNames();
}
async function refreshRemoteNames(){
  try{ const d=await get('/api/remotes'); sel('remote-names').textContent=(d.remotes||[]).join(', ')||'(无)'; }
  catch(e){ sel('remote-names').textContent='(读取失败)'; }
}
async function saveRemoteRaw(){
  const content=sel('remote-conf').value;
  try{
    const d=await put('/api/remotes/raw',{content});
    sel('remote-save-result').textContent='✓ '+(d.remotes||[]).join(', ');
    refreshRemoteNames();
  }catch(e){ sel('remote-save-result').textContent=e.message; }
}

// ==================== logs ====================
async function loadLogs(){
  try{ const d=await get('/api/logs?lines=300'); sel('log-box').textContent=(d.logs||[]).join('\n')||'(暂无日志)'; }
  catch(e){ sel('log-box').textContent=t("loading")+': '+e.message; }
}

// ==================== settings ====================
function openSettings(){
  sel('set-lang').value = LANG;
  sel('set-theme').value = document.documentElement.getAttribute('data-theme') || 'light';
  // pre-fill new username with current
  sel('spw-old').value=''; sel('spw-new').value=''; sel('spw-confirm').value=''; sel('spw-err').textContent='';
  sel('settings-modal').style.display='flex';
}
function closeSettings(){
  sel('settings-modal').style.display='none';
}
sel('set-lang').onchange = async()=>{
  LANG = sel('set-lang').value;
  applyI18n();
  try{ await put('/api/settings', {language: LANG}); }catch(e){}
};
sel('set-theme').onchange = async()=>{
  const theme = sel('set-theme').value;
  applyTheme(theme);
  try{ await put('/api/settings', {theme: theme}); }catch(e){}
};

// Settings change-password form
document.getElementById('settings-pw-form').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const oldPw=sel('spw-old').value;
  const newPw=sel('spw-new').value;
  const confirmPw=sel('spw-confirm').value;
  const newUser=sel('spw-new-user').value;
  const errEl=sel('spw-err');
  errEl.textContent='';
  if(newPw!==confirmPw){ errEl.textContent=t("spw_err_mismatch"); return; }
  if(newPw.length<6){ errEl.textContent=t("spw_err_short"); return; }
  try{
    const r=await fetch('/api/auth/change',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(SESSION_TOKEN||'')},
      body:JSON.stringify({old_password:oldPw,new_password:newPw,new_username:newUser||undefined})});
    const j=await r.json();
    if(!r.ok){ errEl.textContent=j.error||'Error'; return; }
    // 改密成功 -> 自动退出, 回登录页
    SESSION_TOKEN=null;
    closeSettings();
    // 清除输入
    sel('spw-old').value=''; sel('spw-new').value=''; sel('spw-confirm').value=''; sel('spw-new-user').value='';
    showLogin();
    // 提示
    sel('login-err').textContent='';
    sel('login-err').style.color='var(--ok)';
    sel('login-err').textContent=t("pw_changed_logout");
    setTimeout(()=>{ sel('login-err').textContent=''; sel('login-err').style.color='var(--err)'; }, 5000);
  }catch(err){ errEl.textContent=err.message; }
});

// ==================== auth ====================
function showLogin(){
  // 清除可能残留的表单值, 防止浏览器自动填充导致自动提交
  document.getElementById('login-form').reset();
  document.getElementById('login-overlay').style.display='flex';
}
function hideLogin(){
  document.getElementById('login-overlay').style.display='none';
}
document.getElementById('login-form').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const u=document.getElementById('login-user').value;
  const p=document.getElementById('login-pass').value;
  // 密码必须非空且至少触发过手动输入
  if(!u || !p){ document.getElementById('login-err').textContent=t("login_err"); return; }
  document.getElementById('login-err').textContent='';
  document.getElementById('login-err').style.color='var(--err)';
  try{
    const d=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await d.json();
    if(!d.ok){ document.getElementById('login-err').textContent=j.error||t("login_err"); return; }
    SESSION_TOKEN=j.token;
    hideLogin();
    if(j.must_change_password){ showPwModal(u); } else { loadJobs(); }
  }catch(err){ document.getElementById('login-err').textContent=err.message; }
});
function showPwModal(user){
  document.getElementById('pw-user').value=user;
  document.getElementById('pw-old').value='';
  document.getElementById('pw-new').value='';
  document.getElementById('pw-confirm').value='';
  document.getElementById('pw-err').textContent='';
  document.getElementById('pw-modal').style.display='flex';
}
document.getElementById('pw-form').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const oldPw=document.getElementById('pw-old').value;
  const newPw=document.getElementById('pw-new').value;
  const confirmPw=document.getElementById('pw-confirm').value;
  const newUser=document.getElementById('pw-user').value;
  const errEl=document.getElementById('pw-err');
  errEl.textContent='';
  if(newPw!==confirmPw){ errEl.textContent=t("pw_err_mismatch"); return; }
  if(newPw.length<6){ errEl.textContent=t("pw_err_short"); return; }
  try{
    const r=await fetch('/api/auth/change',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SESSION_TOKEN},
      body:JSON.stringify({old_password:oldPw,new_password:newPw,new_username:newUser})});
    const j=await r.json();
    if(!r.ok){ errEl.textContent=j.error||'Error'; return; }
    // 首次改密成功 -> 自动退出, 回登录页
    SESSION_TOKEN=null;
    document.getElementById('pw-modal').style.display='none';
    // 清除表单
    document.getElementById('login-form').reset();
    showLogin();
    // 提示
    document.getElementById('login-err').style.color='var(--ok)';
    document.getElementById('login-err').textContent=t("pw_changed_logout");
    setTimeout(()=>{ document.getElementById('login-err').textContent=''; document.getElementById('login-err').style.color='var(--err)'; }, 5000);
  }catch(err){ errEl.textContent=err.message; }
});
async function doLogout(){
  try{ await fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+(SESSION_TOKEN||'')}}); }catch(e){}
  SESSION_TOKEN=null;
  // 清除登录表单, 防止浏览器自动填充
  document.getElementById('login-form').reset();
  showLogin();
}

async function checkAuthOnLoad(){
  try{
    const r=await fetch('/api/auth/status');
    const j=await r.json();
    if(j.authenticated){
      hideLogin();
      if(j.must_change_password){ showPwModal(j.username); }
      else{ loadJobs(); }
    } else {
      showLogin();
    }
  }catch(e){ showLogin(); }
}

// ==================== settings init ====================
async function initSettings(){
  try{
    const r=await fetch('/api/settings');
    const s=await r.json();
    LANG = s.language || 'zh-CN';
    applyTheme(s.theme || 'light');
  }catch(e){
    applyTheme('light');
  }
  applyI18n();
}

// ==================== init ====================
initSettings().then(()=>checkAuthOnLoad());
setInterval(()=>{ if(currentTab==='jobs' && SESSION_TOKEN) loadJobs(); },5000);
</script>
